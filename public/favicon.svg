<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Favicon for Dental Centar Repić.

    A single D rather than the full DCR monogram: at 16px, three letters merge
    into an unreadable smudge, while one bold letter stays legible. Shares the
    rounded-square shape and colours of src/assets/logo-dcr.svg so the two read
    as the same mark.
  -->
  <rect width="64" height="64" rx="15" fill="#166669"/>
  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M20.5 16 V48"/>
    <path d="M20.5 16 H23.5 a16 16 0 0 1 0 32 H20.5"/>
  </g>
</svg>
